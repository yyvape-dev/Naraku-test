<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乾坤一擲 — Godot演出比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#130e0b;color:#eee0c8;font-family:system-ui,sans-serif;padding:20px}h1{font-size:23px;margin:0 0 8px}p{color:#baa98d;line-height:1.6;font-size:14px;margin:0 0 16px}.controls{display:flex;gap:10px;align-items:center;margin-bottom:18px}button,select{background:#2a1c12;color:#f7dfac;border:1px solid #8d693b;border-radius:5px;padding:10px;font:inherit}main{display:flex;gap:20px;flex-wrap:wrap}.panel{width:min(393px,100%)}h2{font-size:16px;margin:0 0 10px}.stage{width:100%;height:659px;overflow:hidden;border:1px solid #60462c;border-radius:6px}iframe{width:393px;height:659px;border:0;transform-origin:top left;pointer-events:none}.note{margin-top:18px;max-width:820px}</style>
<h1>乾坤一擲：演出比較</h1><p>同じ戦場・同じ縦列で繰り返し再生します。左が従来、右がGodotで作った専用演出。</p>
<div class="controls"><button id="replay">もう一度</button><button id="pause">停止</button><label>速度 <select id="speed"><option value="1">等速</option><option value="0.5">ゆっくり</option><option value="0.25">さらにゆっくり</option></select></label><span id="status">読み込み中…</span></div><div class="controls"><label><input type="checkbox" id="floor" checked> 地割れ・残留岩</label><label><input type="checkbox" id="air" checked> 剣戟・飛散岩</label><label>時点 <input id="scrub" type="range" min="0" max="4.2" step="0.01" value="0"></label><output id="time">0.00秒</output></div>
<main><section class="panel"><h2>従来：共通爆発・魔法陣・地割れ</h2><div class="stage"><iframe title="従来の乾坤一擲" src="../../index.html?riftfx=legacy"></iframe></div></section><section class="panel"><h2>不規則な追い斬撃・巨大な尖岩・裂け目を流れる赤い熱</h2><div class="stage"><iframe title="Godotの乾坤一擲" src="../../index.html?riftfx=godot"></iframe></div></section></main>
<p class="note">初撃と3秒間の地割れダメージは従来どおり。岩は判定終了後も残り、約4.2秒までゆっくり薄れます。手前から奥へ不規則に折れる斬撃が進み、岩盤を抉り裂きます。比較用の敵を同じ位置に置き、戦闘進行を固定しています。スマートフォンでは上下に並びます。</p>
<script>
const frames=[...document.querySelectorAll('iframe')];let engines=[],playing=true,elapsed=0,prev=0;
function fit(){frames.forEach(f=>{const scale=f.parentElement.clientWidth/393;f.style.transform=`scale(${scale})`;f.parentElement.style.height=`${659*scale}px`})}window.addEventListener('resize',fit);fit();
function replay(){if(engines.length!==2)return;elapsed=0;engines.forEach(N=>{N.start(['sword','fox','mage'],4242);const d=frames[engines.indexOf(N)].contentDocument;d.querySelector('#btnPause').click();N.QUAKE_VFX.preview=true;N.sim(12);const sample=N.B.enemies.find(e=>!e.dead);if(sample){N.B.enemies=[[176,110],[185,220],[174,330]].map(([x,y],i)=>({...sample,idx:900+i,x,y,hp:1000,max:1000,spd:0,st:'walk',dead:false,pend:0,tg:null,atkT:100}));}N.B.shots.length=0;N.FX.sh.length=0;N.FX.parts.length=0;N.FX.dust.length=0;N.FX.floats.length=0;N.FX.cut=null;N.FX.banner=null;N.B.slots[0].card=N.CARDS.find(c=>c.id==='sw_rift');N.useCard(0,180,235);N.sim(.2);N.FX.cut=null;N.B.sel=null;N.RIFT_VFX.layerFlags.floor=document.querySelector('#floor').checked;N.RIFT_VFX.layerFlags.air=document.querySelector('#air').checked});}
const ready=setInterval(()=>{try{if(frames.every(f=>f.contentWindow.NARAKU_READY&&f.contentWindow.NARAKU.vfx.riftReady())){engines=frames.map(f=>f.contentWindow.NARAKU);clearInterval(ready);document.querySelector('#status').textContent='再生中';replay()}}catch(e){document.querySelector('#status').textContent='同じサイト上で開いてください'}},100);
document.querySelector('#replay').onclick=()=>{replay();playing=true;document.querySelector('#pause').textContent='停止'};document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'停止':'再生'};
for(const id of ['floor','air'])document.querySelector('#'+id).onchange=e=>{if(engines[1])engines[1].RIFT_VFX.layerFlags[id]=e.target.checked};
document.querySelector('#scrub').oninput=e=>{if(engines.length!==2)return;const t=Number(e.target.value);replay();playing=false;document.querySelector('#pause').textContent='再生';engines.forEach(N=>N.vfx.tick(t));elapsed=t;document.querySelector('#time').textContent=t.toFixed(2)+'秒'};
function loop(ts){const dt=Math.min(.05,(ts-(prev||ts))/1000)*Number(document.querySelector('#speed').value);prev=ts;if(playing&&engines.length===2){elapsed+=dt;engines.forEach(N=>N.vfx.tick(dt));document.querySelector('#scrub').value=Math.min(elapsed,4.2);document.querySelector('#time').textContent=Math.min(elapsed,4.2).toFixed(2)+'秒';if(elapsed>5.0)replay()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
