<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大地割り — Godot演出比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#130e0b;color:#eee0c8;font-family:system-ui,sans-serif;padding:20px}h1{font-size:23px;margin:0 0 8px}p{color:#baa98d;line-height:1.6;font-size:14px;margin:0 0 16px}.controls{display:flex;gap:10px;align-items:center;margin-bottom:18px}button,select{background:#2a1c12;color:#f7dfac;border:1px solid #8d693b;border-radius:5px;padding:10px;font:inherit}main{display:flex;gap:20px;flex-wrap:wrap}.panel{width:min(393px,100%)}h2{font-size:16px;margin:0 0 10px}.stage{width:100%;height:659px;overflow:hidden;border:1px solid #60462c;border-radius:6px}iframe{width:393px;height:659px;border:0;transform-origin:top left;pointer-events:none}.note{margin-top:18px;max-width:820px}</style>
<h1>大地割り：演出比較</h1><p>同じ戦場・同じ発動位置で繰り返し再生します。左が従来、右がGodotで作った専用演出。</p>
<div class="controls"><button id="replay">もう一度</button><button id="pause">停止</button><label>速度 <select id="speed"><option value="1">等速</option><option value="0.5">ゆっくり</option></select></label><span id="status">読み込み中…</span></div>
<main><section class="panel"><h2>従来：共通爆発・魔法陣・地割れ</h2><div class="stage"><iframe title="従来の大地割り" src="../../index.html?quakefx=legacy"></iframe></div></section><section class="panel"><h2>画像原画＋Godot：斬撃・破裂・石片・砂煙</h2><div class="stage"><iframe title="Godotの大地割り" src="../../index.html?quakefx=godot"></iframe></div></section></main>
<p class="note">判定・ダメージ・装填時間は同じです。比較のため戦闘進行を固定しています。スマートフォンでは上下に並びます。</p>
<script>
const frames=[...document.querySelectorAll('iframe')];let engines=[],playing=true,elapsed=0,prev=0;
function fit(){frames.forEach(f=>{const scale=f.parentElement.clientWidth/393;f.style.transform=`scale(${scale})`;f.parentElement.style.height=`${659*scale}px`})}window.addEventListener('resize',fit);fit();
function replay(){if(engines.length!==2)return;elapsed=0;engines.forEach(N=>{N.start(['sword','fox','mage'],4242);const d=frames[engines.indexOf(N)].contentDocument;d.querySelector('#btnPause').click();N.QUAKE_VFX.preview=true;N.sim(12);N.FX.sh.length=0;N.FX.parts.length=0;N.FX.dust.length=0;N.FX.floats.length=0;N.FX.cut=null;N.FX.banner=null;N.B.slots[0].card=N.CARDS.find(c=>c.id==='sw_quake');N.useCard(0,180,235);N.sim(.2);N.FX.cut=null;N.B.sel=null});}
const ready=setInterval(()=>{try{if(frames.every(f=>f.contentWindow.NARAKU_READY)){engines=frames.map(f=>f.contentWindow.NARAKU);clearInterval(ready);document.querySelector('#status').textContent='再生中';replay()}}catch(e){document.querySelector('#status').textContent='同じサイト上で開いてください'}},100);
document.querySelector('#replay').onclick=replay;document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'停止':'再生'};
function loop(ts){const dt=Math.min(.05,(ts-(prev||ts))/1000)*Number(document.querySelector('#speed').value);prev=ts;if(playing&&engines.length===2){elapsed+=dt;engines.forEach(N=>N.vfx.tick(dt));if(elapsed>2.5)replay()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
