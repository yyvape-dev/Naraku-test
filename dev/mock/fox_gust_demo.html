<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>狐火乱舞・風にほどける狐火</title>
<style>*{box-sizing:border-box}body{margin:20px;background:#130e0b;color:#eddfca;font:14px system-ui}h1{font-size:24px}p{max-width:830px;line-height:1.7;color:#bdae99}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}button,select{padding:8px;background:#2a1c12;color:#ffe0ac;border:1px solid #88663c}main{display:flex;flex-wrap:wrap;gap:20px}.panel{width:min(393px,100%)}h2{font-size:16px}.stage{overflow:hidden;border:1px solid #65482c}iframe{width:393px;height:659px;border:0;transform-origin:top left;pointer-events:none}label{white-space:nowrap}</style>
<h1>狐火乱舞：風にほどける狐火</h1>
<p>同じ敵・同じ範囲への発動を比較します。左が前の開花候補、右が火を主役にした新候補です。根元からの立ち上がり、風による破断、火の粉の慣性差を確認します。</p>
<div class="controls"><button id="replay">再発動</button><button id="pause">停止</button><label>速度 <select id="speed"><option value="1">等速</option><option value=".5">1/2</option><option value=".25">1/4</option></select></label><label>敵 <select id="enemy"><option value="knight">盾騎士3体</option><option value="skel">骸骨3体</option><option value="ogre">大鬼</option><option value="scorp">女王</option></select></label></div>
<div class="controls"><label><input id="floor" type="checkbox" checked>奥の炎・接地反射</label><label><input id="air" type="checkbox" checked>手前の炎・火の粉</label><input type="range" id="scrub" min="0" max="1.4" step=".005" value="0"><output id="time">0.000秒</output><span id="status">読み込み中</span></div>
<main><section class="panel"><h2>前候補：花・水面の開花</h2><div class="stage"><iframe title="従来の狐火乱舞" src="../../index.html?hitfx=godot&foxfirefx=bloom"></iframe></div></section><section class="panel"><h2>新候補：風に裂けて燃え尽きる狐火</h2><div class="stage"><iframe title="狐火乱舞の候補" src="../../index.html?hitfx=godot&foxfirefx=gust"></iframe></div></section></main>
<p>55ダメージ・命中0.16秒・範囲72・装填5秒は共通です。時間表示は命中後から。炎が広がる途中にも、範囲全体のダメージは既に確定しています。残る反射や火の粉に追加ダメージはありません。通常ゲームへの採用前の比較候補です。</p>
<script>
const frames=[...document.querySelectorAll('iframe')],$=id=>document.getElementById(id);let engines=[],playing=true,elapsed=0,prev=0;
function fit(){for(const f of frames){const scale=f.parentElement.clientWidth/393;f.style.transform=`scale(${scale})`;f.parentElement.style.height=`${659*scale}px`}}onresize=fit;fit();
function flags(){if(!engines.length)return;const N=engines[1];N.FOX_SKILL.layerFlags.floor=$('floor').checked;N.FOX_SKILL.layerFlags.air=$('air').checked}
function replay(){if(engines.length!==2)return;elapsed=0;for(let i=0;i<2;i++){const N=engines[i];N.start(['fox','sword','mage'],4242);frames[i].contentDocument.querySelector('#btnPause').click();N.QUAKE_VFX.preview=true;N.sim(12);const sample=N.B.enemies.find(e=>!e.dead),type=$('enemy').value,d=N.ENEMIES[type],spots=d.elite?[[190,259]]:[[142,255],[190,229],[235,263]];N.B.enemies=spots.map(([x,y],j)=>({...sample,d,type,idx:900+j,elite:!!d.elite,sc:1,x,y,hp:1000,max:1000,spd:0,st:'walk',dead:false,animT:-1,flash:0,frzT:0,slowT:0,burnT:0,pend:0,tg:null,atkT:99}));N.B.shots.length=0;for(const a of N.B.allies){a.cdT=99;a.pend=null;a.animT=-1}for(const k of ['sh','parts','dust','floats','ghosts'])N.FX[k].length=0;N.FX.cut=null;N.FX.banner=null;N.B.sel=null;N.B.combo=null;N.B.slots[0].card=N.CARDS.find(c=>c.id==='fox_fire');N.useCard(0,190,245);N.sim(10/60);for(const s of N.FX.sh)if(s.k==='beam')s.t=.16;N.FX.cut=null;N.FX.shake=0;for(const e of N.B.enemies)e.flash=.12;}flags();}
function advance(dt){elapsed+=dt;for(const N of engines){N.vfx.tick(dt);for(const e of N.B.enemies)e.flash=Math.max(0,e.flash-dt);for(const a of N.B.allies)if(a.animT>=0){a.animT+=dt;if(a.animT>=a.animDur)a.animT=-1}}$('scrub').value=Math.min(elapsed,1.4);$('time').textContent=elapsed.toFixed(3)+'秒'}
const ready=setInterval(()=>{try{if(frames.every(f=>f.contentWindow.NARAKU_READY&&f.contentWindow.NARAKU.foxSkillReady())){engines=frames.map(f=>f.contentWindow.NARAKU);clearInterval(ready);$('status').textContent='候補比較';replay()}}catch(e){$('status').textContent=e.message}},100);
$('replay').onclick=()=>{replay();playing=true;$('pause').textContent='停止'};$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'停止':'再生'};
for(const id of ['floor','air'])$(id).onchange=flags;$('enemy').onchange=replay;
$('scrub').oninput=e=>{const t=Number(e.target.value);replay();playing=false;$('pause').textContent='再生';for(let u=0;u<t;u+=.005)advance(Math.min(.005,t-u))};
function loop(ts){const dt=Math.min(.05,(ts-(prev||ts))/1000)*Number($('speed').value);prev=ts;if(playing&&engines.length===2){advance(dt);if(elapsed>2.2)replay()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
