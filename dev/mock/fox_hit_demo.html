<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>狐火・被弾比較</title>
<style>*{box-sizing:border-box}body{margin:20px;background:#130e0b;color:#eddfca;font:14px system-ui}h1{font-size:24px}p{max-width:820px;line-height:1.7;color:#bdae99}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}button,select{padding:8px;background:#2a1c12;color:#ffe0ac;border:1px solid #88663c}main{display:flex;flex-wrap:wrap;gap:20px}.panel{width:min(393px,100%)}h2{font-size:16px}.stage{overflow:hidden;border:1px solid #65482c}iframe{width:393px;height:659px;border:0;transform-origin:top left;pointer-events:none}label{white-space:nowrap}</style>
<h1>ユズナミキ：狐火の着弾と敵の被弾</h1>
<p>同じ敵・同じ位置への通常攻撃を比較。右は専用原画をGodotで動かした候補です。敵のひるみは描画上のみ。ダメージと命中処理は共通です。</p>
<div class="controls"><button id="replay">再発動</button><button id="pause">停止</button><label>速度 <select id="speed"><option value="1">等速</option><option value=".5">1/2</option><option value=".25">1/4</option></select></label><label>敵 <select id="enemy"><option value="knight">盾騎士</option><option value="skel">骸骨</option><option value="ogre">大鬼</option><option value="scorp">女王</option></select></label><label><input type="checkbox" id="rapid">0.42秒間隔</label></div>
<div class="controls"><label><input id="floor" type="checkbox" checked>煙</label><label><input id="air" type="checkbox" checked>炎・炎片</label><label><input id="recoil" type="checkbox" checked>被弾動作</label><input type="range" id="scrub" min="0" max=".8" step=".005" value="0"><output id="time">0.000秒</output><span id="status">読み込み中</span></div>
<main><section class="panel"><h2>従来：拡縮する狐火・輪・全身発光</h2><div class="stage"><iframe title="従来" src="../../index.html?hitfx=legacy"></iframe></div></section><section class="panel"><h2>候補：方向を持つ炎・流動・短いひるみ</h2><div class="stage"><iframe title="候補" src="../../index.html?hitfx=godot"></iframe></div></section></main>
<p>通常ゲームへの採用前の比較候補です。狐火乱舞・影縫い・百鬼狐火の主演出は今回変更していません。小画面での速射時の重なりと、敵の輪郭を確認します。</p>
<script>
const frames=[...document.querySelectorAll('iframe')],$=id=>document.getElementById(id);let engines=[],playing=true,elapsed=0,prev=0,nextHit=.42;
function fit(){for(const f of frames){const scale=f.parentElement.clientWidth/393;f.style.transform=`scale(${scale})`;f.parentElement.style.height=`${659*scale}px`}}onresize=fit;fit();
function flags(){if(!engines.length)return;const N=engines[1];N.HIT_VFX.layerFlags.floor=$('floor').checked;N.HIT_VFX.layerFlags.air=$('air').checked;N.HIT_VFX.recoil=$('recoil').checked}
function hit(){for(const N of engines)N.foxPreviewHit(N.B.enemies[0])}
function replay(){if(engines.length!==2)return;elapsed=0;nextHit=.42;for(let i=0;i<2;i++){const N=engines[i];N.start(['fox','sword','mage'],4242);frames[i].contentDocument.querySelector('#btnPause').click();N.QUAKE_VFX.preview=true;N.sim(12);const sample=N.B.enemies.find(e=>!e.dead),type=$('enemy').value,d=N.ENEMIES[type];N.B.enemies=[{...sample,d,type,elite:!!d.elite,sc:1,x:190,y:260,hp:10000,max:10000,spd:0,st:'walk',dead:false,animT:-1,flash:0,frzT:0,slowT:0,burnT:0}];N.B.shots.length=0;for(const k of ['sh','parts','dust','floats','ghosts'])N.FX[k].length=0;N.FX.cut=null;N.FX.banner=null;N.FX.shake=0;N.B.sel=null;}flags();hit();}
function advance(dt){elapsed+=dt;for(const N of engines){N.vfx.tick(dt);N.B.enemies[0].flash=Math.max(0,N.B.enemies[0].flash-dt)}if($('rapid').checked&&elapsed>=nextHit){hit();nextHit+=.42}$('scrub').value=Math.min(elapsed,.8);$('time').textContent=elapsed.toFixed(3)+'秒'}
const ready=setInterval(()=>{try{if(frames.every(f=>f.contentWindow.NARAKU_READY&&f.contentWindow.NARAKU.vfx.foxReady())){engines=frames.map(f=>f.contentWindow.NARAKU);clearInterval(ready);$('status').textContent='候補比較';replay()}}catch(e){$('status').textContent=e.message}},100);
$('replay').onclick=()=>{replay();playing=true;$('pause').textContent='停止'};$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'停止':'再生'};
for(const id of ['floor','air','recoil'])$(id).onchange=flags;for(const id of ['enemy','rapid'])$(id).onchange=replay;
$('scrub').oninput=e=>{const t=Number(e.target.value);replay();playing=false;$('pause').textContent='再生';for(let u=0;u<t;u+=.005)advance(Math.min(.005,t-u))};
function loop(ts){const dt=Math.min(.05,(ts-(prev||ts))/1000)*Number($('speed').value);prev=ts;if(playing&&engines.length===2){advance(dt);if(elapsed>($('rapid').checked?4:1.5))replay()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
