<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラナ（姫騎士）モーション比較</title>
<style>body{margin:0;background:#17151b;color:#f5e4c2;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:18px}h1{font-size:22px}.pair{display:flex;gap:10px}.pair figure{margin:0;width:50%}canvas{width:100%;background:radial-gradient(ellipse at 50% 70%,#454137,#17151b)}button,select,input{font:inherit;margin:8px}button,select{background:#3b3026;color:#f5e4c2;padding:8px;border:1px solid #a88b59}a{color:#e9c587}small{display:block;color:#bfb5a2}#seek{width:85%}</style>
<main><h1>ラナ（姫騎士）</h1><p>元の16コマとRIFE補間31コマの比較</p>
<div class="pair"><figure><figcaption>原画16コマ</figcaption><canvas width="352" height="560" id="original"></canvas></figure><figure><figcaption>補間31コマ（試験）</figcaption><canvas width="352" height="560" id="smooth"></canvas></figure></div>
<button id="play">停止</button><label>速度<select id="speed"><option value="1" selected>実戦相当（旧版の1/2）</option><option value="0.5">1/2</option><option value="0.125">1/8（確認用）</option></select></label><br>
<input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="再生位置"><output id="position"></output>
<p><button data-mode="normal">通常衣装でゲームへ</button><button data-mode="princess">姫騎士・原画でゲームへ</button><button data-mode="smooth">姫騎士・補間でゲームへ</button></p>
<small>衣装は外見のみ。酒場 → ラナ詳細 → 衣装でも変更できます。顔・カード・カットインは従来の絵です。</small><p><a href="../../index.html">ゲームに戻る</a></p></main>
<script>
const durations=[10,8,8,8,6,4,2,2,4,6,6,8,8,8,8,8];
const configs=[{id:'original',name:'sword_princess',ms:durations,hit:7},{id:'smooth',name:'sword_princess_smooth',ms:durations.flatMap((n,i)=>i<15?[n/2,n/2]:[n]),hit:14}];
let running=true,u=0,last=0,ready=false;
function frameAt(c,u){let total=c.ms.reduce((a,b)=>a+b,0),pre=c.ms.slice(0,c.hit).reduce((a,b)=>a+b,0);let t=u<.55?u/.55*pre:pre+(u-.55)/.45*(total-pre),acc=0;for(let i=0;i<c.ms.length;i++){acc+=c.ms[i];if(t<acc)return i}return c.ms.length-1}
async function load(){for(const c of configs){c.meta=await fetch('../assets/'+c.name+'.json').then(r=>r.json());c.img=new Image();c.img.src='../assets/'+c.name+'.webp';await c.img.decode()}ready=true}
function draw(){for(const c of configs){const cv=document.getElementById(c.id),g=cv.getContext('2d');g.clearRect(0,0,352,560);g.fillStyle='#0006';g.beginPath();g.ellipse(c.meta.ax,c.meta.ay,64,13,0,0,Math.PI*2);g.fill();const f=frameAt(c,u);g.drawImage(c.img,f*352,0,352,560,0,0,352,560)}document.getElementById('position').textContent=Math.round(u*100)+'%'}
document.getElementById('play').onclick=e=>{running=!running;e.target.textContent=running?'停止':'再生'};
document.getElementById('seek').oninput=e=>{u=+e.target.value;running=false;document.getElementById('play').textContent='再生';if(ready)draw()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const mode=b.dataset.mode;localStorage.setItem('naraku_lana_costume_v1',JSON.stringify({costume:mode==='normal'?'normal':'princess',smooth:mode==='smooth'}));location.href='../../index.html'});
function tick(t){const dt=Math.min((t-last)/1000,.1);last=t;if(ready){if(running){u=(u+dt*+document.getElementById('speed').value/.9)%1;document.getElementById('seek').value=u}draw()}requestAnimationFrame(tick)}
load().catch(e=>document.getElementById('position').textContent='画像を読めませんでした: '+e.message);requestAnimationFrame(tick);
</script></html>
